name: NHQS Romanian Locale Append

on:
  workflow_dispatch:

jobs:
  append-nhqs-romanian:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Append Romanian to NHQS supported locales
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/edupod/app
            set -a
            . ./.env
            set +a
            psql "${DATABASE_MIGRATE_URL:-$DATABASE_URL}" -X -v ON_ERROR_STOP=1 -qAt <<'SQL'
            UPDATE tenants
            SET supported_locales = supported_locales || '{ro}'::text[]
            WHERE slug = 'nhqs' AND NOT 'ro' = ANY(supported_locales);

            SELECT slug || E'\t' || array_to_string(supported_locales, ',')
            FROM tenants
            WHERE slug = 'nhqs';
            SQL
